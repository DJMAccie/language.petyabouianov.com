    <script>
        // The studio's dark-mode switch stores the choice; this page follows it so
        // the whole site turns over together. It runs before the body paints, so
        // there is never a flash of the light theme.
        (function () {
            try {
                if (localStorage.getItem('studio_dark_mode') !== 'true') return;
                document.documentElement.classList.add('dark');
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', '#121417');
            } catch (e) { /* private mode: stay light */ }
        })();
    </script>
