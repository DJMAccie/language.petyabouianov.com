    <style>
        :root {
            --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: clamp(1rem, 3vw, 2rem);
            background: #fff;
            color: #000;
            font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .home-nav {
            width: min(100%, 22rem);
            display: grid;
            gap: 0.7rem;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 3rem;
            width: 100%;
            border: 2px solid #000;
            background: #fff;
            color: #000;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.96rem;
            font-weight: 700;
            transition: background-color 0.18s var(--ease-out-quart), color 0.18s var(--ease-out-quart);
            animation: button-in 0.42s var(--ease-out-quart) both;
        }

        .home-link:nth-child(2) {
            animation-delay: 0.06s;
        }

        .home-link:nth-child(3) {
            animation-delay: 0.12s;
        }

        .home-link:nth-child(4) {
            animation-delay: 0.18s;
        }

        /* Account access reads as a secondary action next to the studio. */
        .home-link--quiet {
            border-width: 1px;
            border-color: #c7c7c7;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #5f5f5f;
        }

        .home-link--quiet:hover,
        .home-link--quiet:focus-visible {
            border-color: #000;
            color: #fff;
        }

        .home-link:hover,
        .home-link:focus-visible {
            background: #000;
            color: #fff;
            outline: none;
        }

        .home-link:focus-visible {
            outline: 2px solid #000;
            outline-offset: 3px;
        }

        @keyframes button-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .home-link {
                animation: none;
                transition: none;
            }

        }
    </style>
